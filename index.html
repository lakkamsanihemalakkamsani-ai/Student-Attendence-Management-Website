<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 Student Attendance Dashboard</h1>
            <p id="current-date"></p>
        </header>

        <section class="form-section">
            <form id="student-form">
                <input type="text" id="student-name" placeholder="Enter Student Name" required>
                <input type="text" id="student-roll" placeholder="Enter Roll Number" required>
                <button type="submit">Add Student</button>
            </form>
        </section>

        <section class="table-section">
            <table>
                <thead>
                    <tr>
                        <th>Roll No.</th>
                        <th>Name</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="student-list">
                    </tbody>
            </table>
        </section>

        <section class="summary-section">
            <div class="card total">
                <h3>Total Students</h3>
                <p id="total-count">0</p>
            </div>
            <div class="card present">
                <h3>Present</h3>
                <p id="present-count">0</p>
            </div>
            <div class="card absent">
                <h3>Absent</h3>
                <p id="absent-count">0</p>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
